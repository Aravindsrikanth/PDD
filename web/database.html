<!DOCTYPE html>
<html>
<head>
    <title>MySQL Database: icu_management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background: #eef2f7; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { border-bottom: 3px solid #0D47A1; margin-bottom: 20px; padding-bottom: 10px; color: #0D47A1; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #555; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        tr:hover { background: #f1f4ff; }
        .status { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status-critical { background: #ffebee; color: #c62828; }
        .status-stable { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>MySQL Server Console</h1>
                <div style="font-family: monospace; color: #666;">Database: <b>icu_management</b> | Table: <b>patients</b></div>
            </div>
            <div style="color: green; font-weight: bold;">● LIVE SYNC ACTIVE</div>
        </div>
        <table id="dbTable">
            <thead>
                <tr><th>ID</th><th>Patient Name</th><th>Age</th><th>Bed</th><th>Status</th><th>Weight</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        function loadData() {
            const data = localStorage.getItem('mysql_patients');
            const tbody = document.querySelector('#dbTable tbody');
            if (!data || data === '[]') {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">Waiting for data...</td></tr>';
                return;
            }
            const patients = JSON.parse(data);
            tbody.innerHTML = patients.map(p => `
                <tr>
                    <td><b>${p.id || 'N/A'}</b></td>
                    <td>${p.name}</td>
                    <td>${p.age}</td>
                    <td>${p.bedNumber}</td>
                    <td><span class="status status-${(p.status || 'stable').toLowerCase()}">${p.status}</span></td>
                    <td>${p.weight} kg</td>
                </tr>
            `).join('');
        }
        setInterval(loadData, 1000); // Check every second
        loadData();
    </script>
</body>
</html>
